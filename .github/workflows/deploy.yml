name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

jobs:

  terraform-deploy:
    permissions:
      contents: read
    uses: uncle-sola/shared-workflows/.github/workflows/terraform-deploy-github.yml@main
    with:
      environment: dev
      plan-environment: dev-plan  # Same secrets and STATE_* variables as dev, no required reviewers
    secrets: inherit  # Needed so the dev environment's ARM_* secrets reach the shared workflow
