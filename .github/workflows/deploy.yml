name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

jobs:

  deploy-dev:
    permissions:
      contents: read
    uses: uncle-sola/shared-workflows/.github/workflows/terraform-deploy-github.yml@main
    with:
      environment: dev
      plan-environment: dev-plan  # Same secrets and STATE_* variables as dev, no required reviewers
    secrets: inherit  # Needed so the dev environment's ARM_* secrets reach the shared workflow

  deploy-pre:
    needs: deploy-dev  # Only promote to pre once dev has deployed successfully
    permissions:
      contents: read
    uses: uncle-sola/shared-workflows/.github/workflows/terraform-deploy-github.yml@main
    with:
      environment: pre
      plan-environment: pre-plan  # Same secrets and STATE_* variables as pre, no required reviewers
    secrets: inherit  # Needed so the pre environment's ARM_* secrets reach the shared workflow
