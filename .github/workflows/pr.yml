name: Terraform CI/CD

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"

jobs:

  terraform-ci:
    permissions:
      contents: write
      pull-requests: write
    uses: uncle-sola/shared-workflows/.github/workflows/terraform-ci-github.yml@main
    with:
      environment: dev
      plan-environment: dev-plan  # Same secrets as dev, no required reviewers
      state-resource-group: TerraformState-DEV-UKS
      state-storage-account: tfstatestdevuks
      state-container: tfstates
    secrets: inherit  # Needed so the dev environment's ARM_* secrets reach the shared workflow
