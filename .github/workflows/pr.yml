name: Terraform CI/CD

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"

jobs:

  terraform-ci:
    permissions:
      contents: write
      pull-requests: write
    uses: uncle-sola/shared-workflows/.github/workflows/terraform-pr-github.yml@main
    with:
      environment: dev
      plan-environment: dev-plan  # Same secrets and STATE_* variables as dev, no required reviewers
    secrets: inherit  # Needed so the dev environment's ARM_* secrets reach the shared workflow
