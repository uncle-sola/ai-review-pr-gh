name: Terraform CI/CD

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/**"

jobs:

  terraform-ci:
    permissions:
      contents: write
      pull-requests: write
    uses: uncle-sola/shared-workflows/.github/workflows/terraform-ci.yml@main
    secrets:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
